<div class="sl-container">
    <div class="sl-box">
        <form>
            <div class="sl-credentials-box">
                <label class="sl-label-box" for="username">Username</label>
                <input class="sl-input-box" type="text" placeholder="Enter username" required>
                <label class="sl-label-box" for="password">Password</label>
                <input class="sl-input-box" type="password" placeholder="Enter password" required>
            </div>
            <button class="sl-submit-button" type="submit">Login</button>
        </form>
    </div>
</div>
